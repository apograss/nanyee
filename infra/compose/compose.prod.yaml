name: nanyee

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  build:
    context: ../..
    dockerfile: infra/docker/Dockerfile
  image: ghcr.io/apograss/nanyee-backend:latest
  pull_policy: always
  env_file:
    - ../../.env.production
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *logging
  networks:
    - backend

services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - ../../.env.production
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks:
      - backend

  migrate:
    <<: *app
    command: ["alembic", "-c", "services/platform/alembic.ini", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command:
      - uvicorn
      - nanyee.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=172.16.0.0/12
    environment:
      # gateway 固定内网地址（见 networks.backend.ipam），限流按真实客户端 IP 分桶的前提
      NANYEE_TRUSTED_PROXY_IPS: '["172.28.0.10"]'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # TrustedHostMiddleware 只放行 NANYEE_ALLOWED_HOSTS，必须带 Host 头探测
      test:
        - CMD
        - python
        - -c
        - "import json, os, urllib.request; host = json.loads(os.environ['NANYEE_ALLOWED_HOSTS'])[0]; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/ready', headers={'Host': host}), timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    <<: *app
    command: ["nanyee-worker"]
    tmpfs:
      # Chromium --disable-dev-shm-usage 会把共享内存文件写进 /tmp，覆盖 anchor 的 64m
      - /tmp:size=256m,mode=1777
    environment:
      # 非 root + cap_drop ALL 运行 Chromium 必须 --no-sandbox；--disable-dev-shm-usage
      # 避免依赖 /dev/shm（容器默认只有 64MB）
      NANYEE_PLAYWRIGHT_LAUNCH_ARGS: '["--no-sandbox", "--disable-dev-shm-usage"]'
      NANYEE_WORKER_HEARTBEAT_FILE: /tmp/nanyee-worker-heartbeat
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # worker 每次轮询/续租都会 touch 心跳文件；120s 未刷新说明事件循环卡死
      test:
        - CMD-SHELL
        - "test -f /tmp/nanyee-worker-heartbeat && test $$(( $$(date +%s) - $$(stat -c %Y /tmp/nanyee-worker-heartbeat) )) -lt 120"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_AMAP_KEY: ${VITE_AMAP_KEY:-}
        VITE_AMAP_SECURITY_CODE: ${VITE_AMAP_SECURITY_CODE:-}
    image: ghcr.io/apograss/nanyee-web:latest
    pull_policy: always
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    networks:
      backend:
        ipv4_address: 172.28.0.10

# 不能设 internal: true——api/worker 需要出站访问学校上游、群报数、Turnstile、
# 邮件网关和 Cloudflare 出口代理。入站隔离靠不发布端口（仅 gateway 绑 127.0.0.1:8080）。
networks:
  backend:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres-data:
