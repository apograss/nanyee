# nanyee.de 宿主 TLS 反代参考配置（Cloudflare 之后）
#
# 本文件仅供参考，compose 不使用它——容器网关配置见同目录 nanyee.conf。
# 已按 VPS 实况勘察对齐（2026-08）：nginx 1.24（listen ... http2 旧写法）、
# 自签证书 + Cloudflare Full 模式、回源已有 CF-only ACL。
# 切换 = 现有 nanyee.de server 块里的所有 location（旧 Next.js :3000）整体
# 替换为下面这一个 location /，其余（listen/ssl/gzip/ACL include）原样保留。

server {
    listen 80;
    listen 443 ssl http2;
    server_name nanyee.de www.nanyee.de;

    ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

    # 回源只放行 Cloudflare 边缘 IP——这也是 CF-Connecting-IP 可信的前提：
    # 非 CF 来源根本连不上 443，伪造入口在网络层就被断了。
    include /etc/nginx/snippets/allow-cloudflare-only.conf;

    # 不要在这里做 set_real_ip_from 真实 IP 还原！realip 模块在 access 阶段
    # 之前改写来源地址，上面的 ACL 会拿真实客户端 IP 去比对 CF 段 → 全站 403。
    # 保持地址不改写、CF-Connecting-IP 原样透传：后端 nanyee/client.py 在可信
    # 网关后面优先读 CF-Connecting-IP，拿到的就是真实客户端 IP（CF 边缘会覆盖
    # 客户端伪造的该头）。后端限流按真实客户端 IP 分桶，这条链断了会让全站
    # 共用 CF 边缘 IP。

    client_max_body_size 8m; # 容器网关 /api 上限 6m，宿主必须 ≥（默认 1m 会拒上传）

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CF-Connecting-IP 不做 proxy_set_header，按客户端来头原样透传（见上注释）。
        # 容器网关 /api 读超时 35s，宿主必须 ≥
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
