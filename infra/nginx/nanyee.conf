limit_req_zone $binary_remote_addr zone=nanyee_api:10m rate=30r/s;
map $http_x_forwarded_proto $nanyee_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_body_timeout 15s;
    keepalive_timeout 20s;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        image/svg+xml
        application/wasm;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com https://webapi.amap.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.amap.com https://*.autonavi.com; connect-src 'self' https://challenges.cloudflare.com https://webapi.amap.com https://restapi.amap.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location /api/ {
        limit_req zone=nanyee_api burst=60 nodelay;
        client_max_body_size 6m;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nanyee_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 35s;
        proxy_read_timeout 35s;
        proxy_buffering off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        # add_header 在 location 内会覆盖继承，安全响应头在此重复列出
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, immutable";
    }

    # onnxruntime wasm 运行时（~27MB，gzip 后 ~10MB，首次加载后缓存；
    # 文件名不带指纹、升级会变内容，用 7 天中等缓存。
    # 显式 types：nginx 默认不认识 .mjs，nosniff 下模块导入会被拒）
    location /ort-wasm/ {
        types { application/wasm wasm; application/javascript mjs; }
        try_files $uri =404;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # SPA fallback 会内部重定向到这里；expires -1 即 Cache-Control: no-cache，
    # 不使用 add_header 以保留 server 级安全响应头（含 CSP）的继承
    location = /index.html {
        expires -1;
    }
}
