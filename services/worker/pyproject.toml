[project]
name = "nanyee-worker"
version = "0.1.0"
description = "Nanyee durable background worker"
requires-python = ">=3.12,<3.15"
dependencies = [
  "ddddocr>=1.5.6",
  "nanyee-platform",
]

[project.scripts]
nanyee-worker = "nanyee_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanyee_worker"]
