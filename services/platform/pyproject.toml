[project]
name = "nanyee-platform"
version = "0.1.0"
description = "Nanyee FastAPI platform and shared domain package"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiosmtplib>=4.0.0",
  "alembic>=1.15.2",
  "argon2-cffi>=23.1.0",
  "asyncpg>=0.30.0",
  "azure-identity>=1.25.1",
  "azure-keyvault-keys>=4.11.1",
  "beautifulsoup4>=4.13.0",
  "cryptography>=44.0.2",
  "email-validator>=2.2.0",
  "fastapi>=0.115.12",
  "httpx[socks]>=0.28.1",
  "pillow>=11.1.0",
  "pydantic-settings>=2.8.1",
  "python-multipart>=0.0.20",
  "sqlalchemy[asyncio]>=2.0.40",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.34.0",
]

[project.scripts]
nanyee-api = "nanyee.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanyee"]
