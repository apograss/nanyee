[project]
name = "smu-reserver"
version = "0.1.0"
description = "Single-user SMU study cabin reservation scheduler"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1",
  "cryptography>=44",
  "ddddocr>=1.5.6",
  "fastapi>=0.115",
  "httpx>=0.28",
  "itsdangerous>=2.2",
  "jinja2>=3.1",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "respx>=0.22",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smu_reserver"]
