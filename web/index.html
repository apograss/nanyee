<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="canvas:aspect-ratio" content="16:9" />
    <meta name="theme-color" content="#fff7ed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17110d" media="(prefers-color-scheme: dark)" />
    <title>南医工具台 · Nanyee</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // 首屏前确定主题，避免暗色模式闪烁
      (function () {
        try {
          var saved = localStorage.getItem("nanyee-theme");
          var theme = saved === "light" || saved === "dark"
            ? saved
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
        } catch (e) { /* 忽略，默认浅色 */ }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main id="root" data-component="AppRoot" data-od-id="root"></main>
    <noscript>请启用 JavaScript 运行南医工具台。</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
