name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nanyee_ci
          POSTGRES_USER: nanyee_ci
          POSTGRES_PASSWORD: nanyee_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nanyee_ci -d nanyee_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.4"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-packages --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=xml
      - run: uv run python scripts/export_openapi.py --check
      - run: uv run alembic -c services/platform/alembic.ini upgrade head
        env:
          NANYEE_DATABASE_URL: postgresql+asyncpg://nanyee_ci:nanyee_ci@127.0.0.1:5432/nanyee_ci
      - run: uv run alembic -c services/platform/alembic.ini check
        env:
          NANYEE_DATABASE_URL: postgresql+asyncpg://nanyee_ci:nanyee_ci@127.0.0.1:5432/nanyee_ci
